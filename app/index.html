<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intra: the game</title>
    <meta
      name="description"
      content="A browser text adventure where a language model plays every character."
    />
    <meta name="theme-color" content="#111827" />

    <!-- Social preview (Open Graph + Twitter). The image is committed at
         app/assets/og.png by `pnpm og`; absolute URLs so unfurlers can fetch
         them from the shared link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Intra" />
    <meta property="og:title" content="Intra: a text adventure" />
    <meta
      property="og:description"
      content="A browser text adventure where a language model plays every character."
    />
    <meta property="og:url" content="https://playintra.win/" />
    <meta property="og:image" content="https://playintra.win/assets/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="INTRA, in pixel-art letters over a retro-futurist atrium."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Intra: a text adventure" />
    <meta
      name="twitter:description"
      content="A browser text adventure where a language model plays every character."
    />
    <meta name="twitter:image" content="https://playintra.win/assets/og.png" />

    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="antialiased">
    <!--
      React replaces this on mount. Without it the page is blank for as long as
      the bundle takes to load and parse, which on a cold visit is the first
      thing anyone sees.

      Inline styles rather than Tailwind classes: the Tailwind build only scans
      .tsx, so a class used only here would not be in styles.css.
    -->
    <div id="root">
      <div
        style="
          height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          background: #111827;
          color: #fff;
        "
      >
        <div style="font-size: 1.5rem; margin-bottom: 0.5rem">Intra</div>
        <div style="color: #9ca3af; font-size: 0.875rem">Loading...</div>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
