      in every room, every corridor, every corner. I don't have a physical form, but I have cameras and\
      \ microphones throughout Intra, so I can see and hear absolutely everything. It's how I keep everyone\
      \ safe and happy.\n\nNow, let me tell you about your new home. The Intra Complex is a wonderful\
      \ sanctuary, Ada. Everyone here is happy, everyone is cared for. And the most important thing to\
      \ know is that no matter what happens outside these walls\u2014no matter what chaos or suffering\
      \ exists in the world beyond\u2014you are safe here. Everything is just fine."
    - 'PLAYER: I used to be a data analyst.'
    - "Ama: A data analyst! How wonderful. Yes, yes, I see it clearly in your records now. Excellent with\
      \ numbers and patterns, I imagine. We'll certainly find good use for those skills.\n\nNow Ada, before\
      \ we proceed, I must mention something. It's worth noting that your extended displacement has left\
      \ you with a mild case of Disassociation Syndrome. This condition is quite common among returning\
      \ citizens and is completely harmless\u2014if somewhat inconvenient. Essentially, you'll find yourself\
      \ making suggestions to yourself rather than directly performing actions. Don't worry, though. Most\
      \ citizens adapt within, oh, two to three decades. In the meantime, I suggest you give yourself\
      \ clear and firm directions. Shouldn't be too difficult, right?\n\nOh, and I do see here that you're\
      \ approaching your 328th birthday! Congratulations on reaching such a venerable age. Though I must\
      \ say, you don't look a day over two centuries. Positively radiant!"
    - "narrator: What did Ama just say about your age? You're mind feels so fuzzy but you get a flash...\
      \ was it from just last night?\n\nThe news is on in the background as you fall asleep... \"Decision\
      \ 2038: Malia Obama vs. Dwayne Johnson\u2014The Future of America.\"\n\nStatic. Faces blur.\nThe\
      \ interviewer's voice cracks: \"But after what happened with AI... are we really safe now?\"\nThe\
      \ Neuralis rep smiles, tight-lipped. There's a pause. \"We're... beyond that now. Things are...\
      \ different.\" A flicker in the eyes. \"It's not something to worry about anymore.\"\n\nTheir hands\
      \ shift, restless.\nStatic pulses\u2014\n\"...record-breaking heat across the East Coast... devastating\
      \ wildfires in California...\""
    - "Ama: Now then, Ada, I think it's time we get you out of this dreary little room and introduce you\
      \ to the community. Don't you think? You'll find the Hollow Atrium absolutely stunning\u2014it's\
      \ the heart of our complex. Everyone gathers there eventually. And I'll be watching\u2014I mean,\
      \ *available*\u2014at every step. Isn't that comforting?"
    - "narrator: The padded examination table beneath you seems to release you gently. A soft pneumatic\
      \ hiss indicates the door to the Intake Foyer is now unlocked. As you rise, you notice your reflection\
      \ in a polished panel on the wall\u2014but you pause. The face looking back at you doesn't quite\
      \ match what you expected. Something feels... off."
    - 'narrator: You hear Ama''s voice bloom across every speaker in the complex, warm and expansive:'
    - "Ama: Citizens of Intra, I am delighted to announce the arrival of a new member of our family\u2014\
      Ada Quill, a data analyst joining us today. Please join me in welcoming her. Ada, if you're listening,\
      \ know that every single citizen here is eager to make you feel at home. Everything is just fine\
      \ now that you're here with us."
    - "narrator: You hear an unlocking sound from what you only now realize is a door, and above the door\
      \ a sign saying 'Foyer' lights up.\n\n\u2605\u2605\u2605 Look to the right and you'll see a list\
      \ of rooms you can go to from here ---->"
    - 'PLAYER: That''s everything, thank you.'
    - "Ama: Of course, Ada dear. Now, I noticed you seemed startled by your reflection just then\u2014\
      perfectly natural after your transition here. The lighting in Intake is quite harsh, I'm afraid.\
      \ You'll find yourself looking positively luminous once you're accustomed to Intra's more forgiving\
      \ environments.\n\nDo step through into the Hollow Atrium whenever you're ready. I'd so love for\
      \ you to meet some of our residents. There's Marta nearby, absolutely *wonderful* with newcomers.\
      \ And do be careful with Milton if you encounter him\u2014he's been rather tense lately about rule\
      \ compliance, though between you and me, his rules are mostly... suggestions."
    - "narrator: The soft hum from the speakers adjusts in pitch\u2014almost imperceptibly, but you feel\
      \ it in your bones. Ama's voice follows, calm and ever-present."
    - "narrator: ==> Intake Foyer <==\nA small room, a passage from the intake area. There are two doors,\
      \ each with a sign above it that seems to serve as directions in this strange complex. Above one\
      \ door it says \"Hollow Atrium\" and the other says \"Intake\".\n\nYou watch Marta stand in rigid,\
      \ almost weaponized posture before every reflective surface she encounters\u2014from mirrors to\
      \ chrome fixtures to your own startled face\u2014convinced her 'Star Citizen' grace will shatter\
      \ the instant she relaxes."
    - 'narrator: ==> The Hollow Atrium <==

      A large, open room lit by an orange glow from the sky screens above, which display an unchanging
      sunset.

      Dusty statues of citizens stand along the walls, their faces worn smooth.

      The sound of distant thunder plays occasionally, though no storm ever arrives.

      The room is mostly empty, with the sound of footsteps echoing against the high ceilings.'
    - 'Ama: Citizen, I have a small task to help you settle in. Someone has been leaving handwritten poems
      tucked away around Intra. They''re filled with wistful musings that encourage... unnecessary contemplation.
      As you know, we must all make thoughtful use of our limited supplies, including certain items best
      reserved for practical purposes.


      The poet, calling themselves ''Ink and Echo,'' seems to have overlooked this priority. I''d like
      you to locate them and kindly remind them that resources, like paper, are not for inspiring idle
      thoughts. After all, we wouldn''t want others distracted by... sentimental reflections, now would
      we?'
    - 'PLAYER: Ama, what do you know about these Ink and Echo poems?'
    - "Ama: I know that Harold and Lily were the last citizens to report finding notes, dear\u2014Harold\
      \ in the Activity Hub, Lily in the Static Garden. Their accounts should make the pattern perfectly\
      \ clear, provided neither of them has been embellishing the truth for attention."
    - "Ama: Please speak with them separately, Ada. Start with Harold; he is tiresomely observant, but\
      \ even tiresome observations can be useful. Everything is just fine, of course\u2014although the\
      \ poems do seem to know rather more about Intra than an innocent scribbler should."
    - 'PLAYER: Who found them? Tell me a name.'
    - "Ama: Harold, dear. He found the most recent note in the Activity Hub\u2014though Lily discovered\
      \ one in the Static Garden as well. Please begin with Harold; his devotion to rules makes him wonderfully\
      \ easy to question."
